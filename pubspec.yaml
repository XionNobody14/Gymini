name: gymini
description: "Gymini — Seguimiento estructurado de entrenamientos y sobrecarga progresiva."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  hive: ^2.2.3
  path_provider: 2.1.1
  uuid: ^3.0.7
  intl: ^0.19.0

dependency_overrides:
  path_provider_android: 2.2.0
  path_provider_foundation: 2.3.1
  path_provider_linux: 2.2.1
  path_provider_platform_interface: 2.1.1
  path_provider_windows: 2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
